name: Build Windows
# Si pubblica DA SOLO: basta fare Commit + Push su main.
# Se hai alzato il numero di versione (package.json e/o package.journal.json) esce una nuova release.
# Se la versione è la stessa di una release già uscita, non fa niente.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      new: ${{ steps.ver.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Calcolo il nome della release
        id: ver
        shell: bash
        run: |
          B=$(node -p "require('./package.json').version")
          J=$(node -p "require('./package.journal.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; NEW=true
          else
            TAG="v${B}-j${J}"
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then NEW=false; else NEW=true; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Release: $TAG (nuova: $NEW)"
      - name: Trade Logger
        if: steps.ver.outputs.new == 'true'
        shell: bash
        run: |
          npm install
          npx electron-builder --win nsis
          mkdir out && cp dist/Trade-Logger-Setup-*.exe dist/Trade-Logger-Setup-*.exe.blockmap dist/latest.yml out/
      - name: Journal
        if: steps.ver.outputs.new == 'true'
        shell: bash
        run: |
          rm -rf dist && cp package.json package.bar.json && cp package.journal.json package.json
          npm install
          npx electron-builder --win nsis
          cp dist/Journal-Setup-*.exe dist/Journal-Setup-*.exe.blockmap dist/journal.yml out/
      - name: Installer unico (barra + Journal)
        if: steps.ver.outputs.new == 'true'
        continue-on-error: true      # se questo passaggio dovesse fallire, le due app escono lo stesso
        shell: bash
        run: |
          export MSYS_NO_PATHCONV=1
          if ! command -v makensis >/dev/null 2>&1; then
            choco install nsis -y --no-progress
            export PATH="$PATH:/c/Program Files (x86)/NSIS"
          fi
          W() { cygpath -w "$(realpath "$1")"; }
          BAR=$(W "$(ls out/Trade-Logger-Setup-*.exe | head -1)")
          JOU=$(W "$(ls out/Journal-Setup-*.exe | head -1)")
          OUT="$(W out)\\Trade-Logger-Journal-Setup.exe"
          URL="https://github.com/${{ github.repository }}/releases/latest/download"
          makensis -V2 "-DBAR=$BAR" "-DJOURNAL=$JOU" "-DOUT=$OUT" "-DURL=$URL" "-DVER=${{ steps.ver.outputs.tag }}" build/suite.nsi
          ls -la out
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.new == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: out/*
      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.new == 'true'
        with: { name: windows-app, path: out/* }

  # Versione per Mac: parte dopo quella Windows, solo quando esce una release nuova, e aggiunge i file alla stessa release.
  # Se dovesse fallire, la release Windows resta com'è.
  mac:
    needs: win
    if: needs.win.outputs.new == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Trade Logger (Mac)
        shell: bash
        run: |
          npm install
          npx electron-builder --mac dmg zip --publish never
          mkdir out && cp dist/*.dmg dist/*.zip out/
      - name: Journal (Mac)
        shell: bash
        run: |
          rm -rf dist && cp package.json package.bar.json && cp package.journal.json package.json
          npm install
          npx electron-builder --mac dmg zip --publish never
          cp dist/*.dmg dist/*.zip out/
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.win.outputs.tag }}
          files: out/*
